name: SpeedrunTeam CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install root (backend) dependencies
      run: npm ci

    - name: Run backend unit tests
      run: npm test

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Verify frontend build compilation
      working-directory: ./frontend
      run: npm run build
