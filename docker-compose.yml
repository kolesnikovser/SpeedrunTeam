version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speedrunteam-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Optional: persist database file outside the container
      - db-data:/app/database

volumes:
  db-data:
